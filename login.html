<!DOCTYPE html>
<html>
    <head>
        <title> LOGIN</title>
        <link rel="stylesheet" href="static/style.css">
    </head>
    <body>
        <h1>
            There's always someone in need of Food
            <img src='{{ url_for("static", filename="/image.png")}}'>
        </h1>
        {% with messages=get_flashed_messages() %}
        <ul>
            {% for msg in messages %}
            <li>
                 {{msg}}
            </li>
            {% endfor %}
        {% endwith %}
        </ul>
        <form method="post" action="{{ url_for("login")}}">
            <label>
                Enter your name:
            </label>
            <input type="text" name = "username">
            <br>
            <label>
                Enter your password:
            </label>
            <input type="password" name = "password">
            <br>
            <input type="submit" value = "LOGIN">
        </form>

        <div class="hint-box">
            <p><strong>Demo Login Info</strong></p>
            <p><b>Name:</b> admin<br><b>Password:</b> 123456</p>
        </div>
</body>
</html>
